[package]
name = "graph-tui"
version = "0.1.0"
edition = "2021"
description = "universal graph render engine for the terminal: box-drawing edges, one true colour per group, orthogonal routing with crossings, interactive pan/zoom"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
