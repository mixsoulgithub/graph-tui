[package]
name = "graph-tui"
version = "0.1.2"
edition = "2021"
rust-version = "1.88"
description = "universal graph render engine and editor for the terminal: box-drawing edges, one true colour per group, orthogonal routing with crossings, pan/zoom, multi-line nodes, edge notes"
license = "MIT"
repository = "https://github.com/mixsoulgithub/graph-tui"
readme = "README.md"
keywords = ["tui", "graph", "terminal", "graphviz", "diagram"]
categories = ["command-line-utilities", "visualization"]
# 设计笔记与任务清单留在本地,不进包(仓库还没有历史时 cargo 不按 .gitignore 过滤)
exclude = ["/local", "/.github", "*.cast", "*.gif", "*.png", "*.jpg"]

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
