[package]
name = "graph-tui"
version = "0.19.0"
edition = "2021"
rust-version = "1.88"
description = "universal graph render engine and editor for the terminal: box-drawing edges, one true colour per group, orthogonal routing with crossings, pan/zoom, multi-line nodes, edge notes"
license = "MIT"
repository = "https://github.com/mixsoulgithub/graph-tui"
readme = "README.md"
keywords = ["tui", "graph", "terminal", "graphviz", "diagram"]
categories = ["command-line-utilities", "visualization"]
# design notes and the task list stay local and are kept out of the package
# (cargo does not honour .gitignore when the repo has no history yet)
exclude = ["/local", "/.github", "*.cast", "*.gif", "*.png", "*.jpg"]

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
