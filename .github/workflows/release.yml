name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/create-gh-release-action@v1
        with:
          title: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: smoke (unix)
        if: runner.os != 'Windows'
        run: |
          cargo build --release --target ${{ matrix.target }}
          ./target/${{ matrix.target }}/release/graph-tui --version
      - name: smoke (windows)
        if: runner.os == 'Windows'
        run: |
          cargo build --release --target ${{ matrix.target }}
          ./target/${{ matrix.target }}/release/graph-tui.exe --version
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: graph-tui
          target: ${{ matrix.target }}
          archive: graph-tui-$target
          include: LICENSE,README.md
          checksum: sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: publish to crates.io
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # the tag and Cargo.toml must name the same version, or the wrong crate goes out
      - name: tag matches Cargo.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $crate"
            exit 1
          fi
          echo "publishing graph-tui $crate"
      # rerunning on the same tag must not fail against crates.io
      - name: already published?
        id: crates
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          # sparse index: one line per published version, steadier than the crates.io API
          # (which answers 403 for some user agents)
          if curl -fsS -A "graph-tui-release" https://index.crates.io/gr/ap/graph-tui \
               | grep -q "\"vers\":\"$crate\""; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "graph-tui $crate is already on crates.io; not publishing again"
          fi
      - name: cargo publish
        if: steps.crates.outputs.skip != '1'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN is not set; the crate was not published"
            exit 0
          fi
          cargo publish
